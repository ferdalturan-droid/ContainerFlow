# ContainerFlow — nginx reverse proxy (HTTPS with Let's Encrypt / TLS)
# Use this file AFTER you have a certificate. Quick path with certbot:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot certonly --nginx -d your-domain.example.com
#   # certbot will create /etc/letsencrypt/live/your-domain.example.com/
#   sudo cp /app/deploy/nginx/containerflow-ssl.conf /etc/nginx/sites-available/containerflow
#   sudo sed -i 's/your-domain.example.com/REAL_DOMAIN/g' /etc/nginx/sites-available/containerflow
#   sudo ln -sf /etc/nginx/sites-available/containerflow /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Auto-renewal is installed by certbot; verify with: sudo systemctl status certbot.timer

upstream containerflow_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream containerflow_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ----- HTTP → HTTPS redirect -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;

    # Allow certbot HTTP-01 challenge files
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# ----- HTTPS server ----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.example.com;

    # ---- SSL / TLS ----
    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- HSTS (one year + subdomains) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    client_max_body_size 25M;

    # ---- API ----
    location /api/ {
        proxy_pass http://containerflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ---- Frontend ----
    location / {
        proxy_pass http://containerflow_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 90s;
    }

    # Optional health check that bypasses upstreams
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
