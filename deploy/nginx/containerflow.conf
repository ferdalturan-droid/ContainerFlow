# ContainerFlow — nginx reverse proxy (HTTP-only, for local dev / pre-SSL VPS)
# Place this file at /etc/nginx/sites-available/containerflow then symlink it:
#   ln -sf /etc/nginx/sites-available/containerflow /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Replace `your-domain.example.com` with your real domain. Once your DNS A-record
# points to the server you can run: certbot --nginx -d your-domain.example.com
# which will rewrite this config to add the SSL block (or use containerflow-ssl.conf).

upstream containerflow_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream containerflow_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com _;

    # Increase client body for image uploads (genbrug photos, receipts).
    client_max_body_size 25M;

    # Standard security headers (HTTPS version adds HSTS).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # API
    location /api/ {
        proxy_pass http://containerflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Frontend (React dev server / built static via "serve")
    location / {
        proxy_pass http://containerflow_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 90s;
    }

    # Optional health check that bypasses upstreams
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
